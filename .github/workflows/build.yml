name: Checks and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the whole app and its test suite are
      # plain files. This runs in a couple of seconds.
      - name: Run checks
        run: node test.js

      - name: dist/ is committed up to date
        run: |
          node build.js
          if ! git diff --quiet -- dist/; then
            echo "::error file=dist/koine-drill.html::dist/ is out of date. Run 'node build.js' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi

  deploy:
    name: Publish to GitHub Pages
    needs: test
    # Only the default branch is published, whatever it happens to be called.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: node build.js

      - name: Stage the site
        run: |
          mkdir -p _site/offline
          cp index.html styles.css _site/
          cp -r js _site/js
          # The single-file build, served as its own page, so it can be saved
          # for offline use straight from the browser.
          cp dist/koine-drill.html _site/offline/index.html

      # A workflow token is not allowed to create the Pages site, so Pages has
      # to be switched on once by hand. Rather than failing red on every push
      # until someone does, say plainly what to do and stop here.
      - name: Is Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not switched on. Settings → Pages → Build and deployment → Source → GitHub Actions, then re-run this workflow."
            {
              echo "## The site was built but not published"
              echo
              echo "GitHub Pages is not switched on for this repository yet, and a workflow"
              echo "token is not permitted to switch it on."
              echo
              echo "**One manual step, once:** Settings → Pages → Build and deployment →"
              echo "Source → **GitHub Actions**."
              echo
              echo "Then re-run this workflow. Every push after that publishes automatically."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.on == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4
